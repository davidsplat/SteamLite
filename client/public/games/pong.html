<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SteamLite - Elden Ring Pong</title>
    <style>
        body { margin: 0; background-color: #171a21; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background-color: #1b2838; border: 2px solid #d4af37; border-radius: 8px; box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); cursor: none; }
        h1 { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.7); }
        .hud { display: flex; gap: 40px; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Elden Ring: Boss Pong</h1>
    <div class="hud">
        <span style="color: #4c6b22;">Tú: <span id="playerLives">❤️❤️❤️</span></span>
        <span style="color: #b32222;">Jefe: <span id="cpuLives">❤️❤️❤️</span></span>
    </div>
    <canvas id="pongCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const playerLivesEl = document.getElementById('playerLives');
        const cpuLivesEl = document.getElementById('cpuLives');

        let playerLives = 3, cpuLives = 3;
        let player = { x: 10, y: 160, w: 10, h: 80 };
        let cpu = { x: 580, y: 160, w: 10, h: 80 };
        let ball = { x: 300, y: 200, r: 8, speedX: 6, speedY: 6, baseSpeed: 6 };
        let gameActive = true;

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            player.y = e.clientY - rect.top - player.h / 2;
            if (player.y < 0) player.y = 0;
            if (player.y + player.h > canvas.height) player.y = canvas.height - player.h;
        });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speedX = (Math.random() > 0.5 ? ball.baseSpeed : -ball.baseSpeed);
            ball.speedY = (Math.random() > 0.5 ? 4 : -4);
        }

        function update() {
            if (!gameActive) return;

            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Rebote paredes
            if (ball.y - ball.r < 0 || ball.y + ball.r > canvas.height) ball.speedY *= -1;

            // IA Jefe
            let targetY = ball.y - cpu.h / 2;
            cpu.y += (targetY - cpu.y) * 0.07;

            // Colisiones paletas
            if (ball.x - ball.r < player.x + player.w && ball.y > player.y && ball.y < player.y + player.h) {
                ball.speedX = Math.abs(ball.speedX) * 1.05; // Acelerar
                ball.x = player.x + player.w + ball.r;
            }
            if (ball.x + ball.r > cpu.x && ball.y > cpu.y && ball.y < cpu.y + cpu.h) {
                ball.speedX = -Math.abs(ball.speedX) * 1.05;
                ball.x = cpu.x - ball.r;
            }

            // Puntos
            if (ball.x - ball.r < 0) { // Punto Jefe
                playerLives--;
                playerLivesEl.innerText = "❤️".repeat(Math.max(0, playerLives));
                if (playerLives <= 0) endGame("El Jefe te ha derrotado...");
                resetBall();
            } else if (ball.x + ball.r > canvas.width) { // Punto Jugador
                cpuLives--;
                cpuLivesEl.innerText = "❤️".repeat(Math.max(0, cpuLives));
                if (cpuLives <= 0) endGame("¡Has derrotado al Jefe!");
                resetBall();
            }
        }

        function endGame(msg) {
            gameActive = false;
            setTimeout(() => alert(msg), 100);
        }

        function draw() {
            ctx.fillStyle = '#1b2838';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Línea central
            ctx.strokeStyle = '#2a475e';
            ctx.setLineDash([10, 10]);
            ctx.beginPath(); ctx.moveTo(300, 0); ctx.lineTo(300, 400); ctx.stroke();
            ctx.setLineDash([]);

            ctx.fillStyle = '#4c6b22'; ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = '#b32222'; ctx.fillRect(cpu.x, cpu.y, cpu.w, cpu.h);
            
            ctx.fillStyle = '#d4af37';
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
