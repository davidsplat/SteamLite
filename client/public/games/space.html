<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SteamLite - Space Shooter</title>
    <style>
        body { margin: 0; background-color: #171a21; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { background-color: #0b0f19; border: 2px solid #00A4FF; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 164, 255, 0.4); }
        h1 { color: #00A4FF; text-shadow: 0 0 10px rgba(0, 164, 255, 0.5); }
        #score { font-size: 24px; font-weight: bold; color: #4c6b22; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Space Shooter: Boss</h1>
    <p>Flechas mover | Espacio disparar</p>
    <div id="score">Puntos: 0</div>
    <canvas id="gameCanvas" width="600" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let score = 0, gameActive = true, bossActive = false;
        let player = { x: 280, y: 450, w: 40, h: 40, speed: 6 };
        let bullets = [], asteroids = [], enemyBullets = [];
        let boss = { x: 250, y: -100, w: 100, h: 80, hp: 20, active: false };
        let keys = {};

        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        // Estrellas
        let stars = Array.from({length: 50}, () => ({ x: Math.random()*600, y: Math.random()*500, s: Math.random()*2 }));

        setInterval(() => {
            if (!gameActive) return;
            if (score >= 20 && !boss.active) {
                boss.active = true;
                boss.hp = 20;
                boss.y = -80;
            } else if (!boss.active) {
                asteroids.push({ x: Math.random()*560, y: -40, w: 40, h: 40, speed: 2 + Math.random()*3, color: '#b32222' });
            }
        }, 800);

        function update() {
            if (!gameActive) return;

            // Movimiento
            if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
            if (keys['ArrowRight'] && player.x < 560) player.x += player.speed;

            // Disparar
            if (keys['Space'] && (bullets.length === 0 || bullets[bullets.length-1].y < 420)) {
                bullets.push({ x: player.x + 18, y: player.y, w: 4, h: 15, speed: 10 });
                keys['Space'] = false;
            }

            // Balas jugador
            bullets.forEach((b, i) => {
                b.y -= b.speed;
                if (b.y < 0) bullets.splice(i, 1);
            });

            // Boss
            if (boss.active) {
                if (boss.y < 50) boss.y += 2;
                else {
                    boss.x += Math.sin(Date.now() / 500) * 3; // Movimiento oscilante
                    if (Math.random() < 0.02) {
                        enemyBullets.push({ x: boss.x + 50, y: boss.y + 80, w: 6, h: 20, speed: 5 });
                    }
                }
            }

            // Balas enemigas
            enemyBullets.forEach((b, i) => {
                b.y += b.speed;
                if (b.y > 500) enemyBullets.splice(i, 1);
                if (b.x < player.x + 40 && b.x + 6 > player.x && b.y < player.y + 40 && b.y + 20 > player.y) {
                    gameActive = false; alert("¡Game Over! Puntos: " + score); location.reload();
                }
            });

            // Colisiones
            asteroids.forEach((a, i) => {
                a.y += a.speed;
                if (a.y > 500) asteroids.splice(i, 1);
                if (a.x < player.x + 40 && a.x + 40 > player.x && a.y < player.y + 40 && a.y + 40 > player.y) {
                    gameActive = false; alert("¡Game Over! Puntos: " + score); location.reload();
                }
            });

            bullets.forEach((b, bi) => {
                asteroids.forEach((a, ai) => {
                    if (b.x < a.x + 40 && b.x + 4 > a.x && b.y < a.y + 40 && b.y + 15 > a.y) {
                        bullets.splice(bi, 1); asteroids.splice(ai, 1);
                        score += 10; scoreEl.innerText = "Puntos: " + score;
                    }
                });
                // Colisión con Boss
                if (boss.active && b.x < boss.x + boss.w && b.x + 4 > boss.x && b.y < boss.y + boss.h && b.y + 15 > boss.y) {
                    bullets.splice(bi, 1);
                    boss.hp--;
                    if (boss.hp <= 0) {
                        boss.active = false; score += 100; scoreEl.innerText = "Puntos: " + score;
                        alert("¡Jefe Derrotado! ¡Siguiente nivel!"); boss.y = -100;
                    }
                }
            });
        }

        function draw() {
            ctx.fillStyle = '#0b0f19'; ctx.fillRect(0, 0, 600, 500);
            ctx.fillStyle = 'white'; stars.forEach(s => { s.y += 0.5; if(s.y>500) s.y=0; ctx.fillRect(s.x, s.y, s.s, s.s); });
            
            // Jugador
            ctx.fillStyle = '#0056b3'; ctx.beginPath(); ctx.moveTo(player.x+20, player.y); ctx.lineTo(player.x, player.y+40); ctx.lineTo(player.x+40, player.y+40); ctx.fill();
            
            // Balas
            ctx.fillStyle = '#00A4FF'; bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
            ctx.fillStyle = '#ff4444'; enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

            // Asteroides
            ctx.fillStyle = '#b32222'; asteroids.forEach(a => { ctx.beginPath(); ctx.arc(a.x+20, a.y+20, 20, 0, Math.PI*2); ctx.fill(); });

            // Boss
            if (boss.active) {
                ctx.fillStyle = '#8b0000'; ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
                // Barra de vida del Boss
                ctx.fillStyle = '#ff0000'; ctx.fillRect(boss.x, boss.y - 10, (boss.hp/20)*boss.w, 5);
                ctx.strokeStyle = 'white'; ctx.strokeRect(boss.x, boss.y - 10, boss.w, 5);
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
